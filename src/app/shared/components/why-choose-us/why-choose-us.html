<section class="why-choose-us">

  <div class="container">

    <div class="section-header">

      <span class="section-subtitle">
        {{ data.subtitle }}
      </span>

      <h2>
        {{ data.title }}
      </h2>

      <p>
        {{ data.description }}
      </p>

    </div>

    <div class="why-grid">

      @for (item of data.items; track item.title) {

        <div class="why-card">

          <div class="icon">

            <span class="material-symbols-outlined">
              {{ item.icon }}
            </span>

          </div>

          <h3>
            {{ item.title }}
          </h3>

          <p>
            {{ item.description }}
          </p>

        </div>

      }

    </div>

  </div>

</section>
