<section class="about-section">

  <div class="container">

    <div class="about-grid">

      <div class="about-image">

        <img
          [src]="about.image"
          [alt]="about.title">

        <div class="experience-card">

          <h3>{{ about.experience }}</h3>

          <p>{{ about.experienceText }}</p>

        </div>

      </div>

      <div class="about-content">

        <span class="section-subtitle">
          {{ about.subtitle }}
        </span>

        <h2>
          {{ about.title }}
        </h2>

        <p>
          {{ about.description }}
        </p>

        <a
          class="about-btn"
          [routerLink]="about.buttonRoute">

          {{ about.buttonText }}

        </a>

      </div>

    </div>

  </div>

</section>
