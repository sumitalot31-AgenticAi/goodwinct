@if (images().length) {

<section class="project-gallery">

  <div class="gallery-preview">

    <img
      [src]="selectedImage()"
      alt="Project Image"
      class="preview-image">

  </div>

  <div class="gallery-thumbnails">

    @for (image of images(); track image; let i = $index) {

      <img
        [src]="image"
        [alt]="'Project Image ' + (i + 1)"
        (click)="selectImage(i)"
        [class.active]="selectedIndex() === i">

    }

  </div>

</section>

}
