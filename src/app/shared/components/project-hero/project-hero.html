<section class="project-hero">

  <img
    class="hero-image"
    [src]="project().coverImage"
    [alt]="project().name">

  <div class="hero-overlay">

    <div class="container">

      <div class="hero-content">

        <span
          class="project-status"
          [class.running]="project().status === 'Running'"
          [class.upcoming]="project().status === 'Upcoming'"
          [class.completed]="project().status === 'Completed'">

          {{ project().status }}

        </span>

        <h1>

          {{ project().name }}

        </h1>

        <p class="hero-location">

          📍 {{ project().location }}

        </p>

        <p class="hero-description">

          {{ project().shortDescription }}

        </p>

        <div class="hero-price">

          <span>Starting From</span>

          <h2>

            {{ project().price }}

          </h2>

        </div>

        <div class="hero-actions">

          <a
            href="#enquiry"
            class="btn-primary">

            Book Site Visit

          </a>

          @if (project().brochure) {

          <a
            [href]="project().brochure"
            target="_blank"
            class="btn-secondary">

            Download Brochure

          </a>

          }

        </div>

      </div>

    </div>

  </div>

</section>
