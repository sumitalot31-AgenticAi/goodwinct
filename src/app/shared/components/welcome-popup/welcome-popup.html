<p>welcome-popup works!</p>
@if (isVisible()) {
  <div class="popup-overlay">

    <div class="popup-card">

      <button
        class="close-btn"
        (click)="close()"
        aria-label="Close">
        ✕
      </button>

      <div class="popup-image">
        <img
          [src]="popup.image"
          [alt]="popup.title">
      </div>

      <div class="popup-content">

        <h2>{{ popup.title }}</h2>

        <h4>{{ popup.subtitle }}</h4>

        <p>
          {{ popup.description }}
        </p>

        <div class="popup-actions">

          <a
            class="btn btn-primary"
            [routerLink]="popup.primaryButton.route"
            (click)="close()">
            {{ popup.primaryButton.text }}
          </a>

          <button
            class="btn btn-outline"
            (click)="close()">
            {{ popup.secondaryButton.text }}
          </button>

        </div>

      </div>

    </div>

  </div>
}
