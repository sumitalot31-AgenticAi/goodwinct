<button
  class="scroll-top"
  [class.show]="showButton()"
  (click)="scrollToTop()"
  aria-label="Scroll to top">

  <svg
    width="22"
    height="22"
    viewBox="0 0 24 24"
    fill="none">

    <path
      d="M12 19V5M5 12L12 5L19 12"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round">
    </path>

  </svg>

</button>
